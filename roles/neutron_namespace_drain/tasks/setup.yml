---

- name: Ensure pip is installed
  ansible.builtin.pip:
    name:
      - pip
    state: forcereinstall
    virtualenv: "{{ neutron_namespace_drain_venv }}"
    virtualenv_command: "{{ neutron_namespace_drain_venv_python }} -m venv"
  run_once: true
  become: true
  delegate_to: "{{ neutron_namespace_play_host }}"
  vars:
    # NOTE: Without this, the delegate ansible_host variable will not
    # be respected when using delegate_to.
    ansible_host: "{{ neutron_namespace_play_host }}"

- name: Set up openstack cli virtualenv
  ansible.builtin.pip:
    virtualenv: "{{ neutron_namespace_drain_venv }}"
    name:
      - python-openstackclient
    state: present
    extra_args: "{% if pip_upper_constraints_file %}-c {{ pip_upper_constraints_file }}{% endif %}"
  run_once: true
  become: true
  delegate_to: "{{ neutron_namespace_play_host }}"
  vars:
    # NOTE: Without this, the delegate ansible_host variable will not
    # be respected when using delegate_to.
    ansible_host: "{{ neutron_namespace_play_host }}"

---
- name: Query source SRC_L3_ID
  ansible.builtin.command: >
    {{ neutron_namespace_drain_venv }}/bin/openstack
    network agent list --host {{ neutron_namespace_drain_host }}
    --agent-type l3 -f value -c ID
  register: src_l3_id
  environment: "{{ openstack_auth_env }}"
  changed_when: false
  delegate_to: "{{ neutron_namespace_play_host }}"
  vars:
    ansible_host: "{{ hostvars[neutron_namespace_drain_host].ansible_host }}"

- name: Enable L3 agent
  ansible.builtin.command: >
    {{ neutron_namespace_drain_venv }}/bin/openstack
    network agent set "{{ src_l3_id.stdout }}" --enable
  environment: "{{ openstack_auth_env }}"
  changed_when: false
  delegate_to: "{{ neutron_namespace_play_host }}"
  vars:
    ansible_host: "{{ hostvars[neutron_namespace_drain_host].ansible_host }}"
